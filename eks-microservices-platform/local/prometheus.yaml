# Local scrape config. In a cluster this job is generated by the PodMonitor
# each chart renders; here the targets are static.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:9090"]
        labels: { service: gateway }

  - job_name: catalog
    static_configs:
      - targets: ["catalog:9090"]
        labels: { service: catalog }

  # The scorer serves metrics on its API port: uvicorn runs one app on one
  # port, so unlike the Go services it has no separate admin listener.
  - job_name: scorer
    static_configs:
      - targets: ["scorer:8080"]
        labels: { service: scorer }
