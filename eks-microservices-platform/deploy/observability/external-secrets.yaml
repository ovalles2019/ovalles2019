# Secret delivery.
#
# No credential is ever committed, templated into a chart, or set with
# `kubectl create secret` by hand. AWS Secrets Manager holds the value; the
# External Secrets controller authenticates with an IRSA role scoped to this
# environment's secret prefix and syncs it into a Kubernetes Secret.
#
# What that buys over `kubectl create secret`:
#   - rotating in Secrets Manager propagates automatically on refreshInterval
#   - the value is never in git, in CI logs, or in Helm release history
#   - access is an IAM policy, so it is auditable in CloudTrail
#   - a new cluster is bootstrapped without anyone handling the plaintext
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: fleet-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            # IRSA. The role's trust policy pins this exact namespace and
            # ServiceAccount, so no other pod can assume it.
            name: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalog-secrets
  namespace: fleet-platform
spec:
  # Hourly. A rotation in Secrets Manager reaches the cluster within the hour
  # without a deploy; shorter intervals mostly buy API calls.
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: catalog-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      # Assembled from separate fields rather than storing a full DSN, so the
      # password can be rotated independently of the host and database name.
      data:
        database-url: "postgres://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require"

  dataFrom:
    - extract:
        # RDS writes exactly these keys when it manages a master password, so
        # this consumes the rotation AWS already performs.
        key: fleet-platform-prod/catalog/database
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gateway-secrets
  namespace: fleet-platform
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore

  target:
    name: gateway-secrets
    creationPolicy: Owner

  data:
    - secretKey: api-keys
      remoteRef:
        key: fleet-platform-prod/gateway/api-keys
        property: keys
