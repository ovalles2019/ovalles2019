[project]
name = "scorer"
version = "0.1.0"
description = "CPU-bound anomaly scoring service — the platform's HPA target."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "prometheus-client>=0.21,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    # starlette's TestClient requires httpx2; the older httpx raises a
    # deprecation warning that this project's filterwarnings=error turns fatal.
    "httpx2",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Fail on warnings so a deprecation is dealt with when it appears rather than
# on the day it becomes an error.
filterwarnings = ["error"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit security rules
    "C4",   # comprehensions
    "SIM",  # simplify
]
# S101 (assert) is the whole point of a test file.
per-file-ignores = { "tests/*" = ["S101"] }

[tool.coverage.run]
source = ["app"]
